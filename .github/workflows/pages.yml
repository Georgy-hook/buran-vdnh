name: Publish Buran exhibit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check downloadable kit and offline scene
        run: |
          set -eu
          test -s site/index.html
          test -s site/assets/model-data.js
          test -s site/assets/catalog.js
          for view in hero cockpit fin gear; do test -s "site/assets/$view.webp"; done
          test -s site/files/Buran-VDNH.FCStd
          unzip -tq site/files/Buran.usdz
          unzip -tq site/files/Buran-STL.zip
          test "$(find site/files/stl -type f -name '*.stl' | wc -l)" -eq 20
      - id: bundle
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for this run's Pages artifact to be discoverable
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ needs.package.outputs.artifact_id }}
        run: |
          set -eu
          test -n "$EXPECTED_ID"
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          for delay in 1 2 4 8 16; do
            id=$(gh api "$endpoint" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id')
            if [ "$id" = "$EXPECTED_ID" ]; then
              exit 0
            fi
            sleep "$delay"
          done
          echo "Pages artifact $EXPECTED_ID was not indexed for run $GITHUB_RUN_ID" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
